<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Blog social preview">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#241b35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#131316" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b854d4"/>
      <stop offset="100%" stop-color="#8038d1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#131316"/>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#2c2c34" stroke-width="2"/>

  <!-- Accent indicator bar -->
  <rect x="100" y="160" width="60" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- Title & Author -->
  <text x="100" y="260" font-family="'JetBrains Mono', monospace" font-size="54" font-weight="700" fill="#fcfcfd" letter-spacing="-1">
    Engineering &amp; Software Notes
  </text>
  <text x="100" y="330" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="400" fill="#9393a2">
    Personal blog on systems, performance, and tooling
  </text>

  <!-- Footer metadata inside card -->
  <line x1="100" y1="460" x2="1100" y2="460" stroke="#25252d" stroke-width="1.5"/>
  <text x="100" y="505" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="600" fill="#fcfcfd">
    Muhammad Rafky
  </text>
  <text x="1100" y="505" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#b854d4">
    #blog
  </text>
</svg>
